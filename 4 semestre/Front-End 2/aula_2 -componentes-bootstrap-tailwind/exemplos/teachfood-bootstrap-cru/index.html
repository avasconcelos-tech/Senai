<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechFood — Sabor & Saber</title>

    <!-- Bootstrap 5.3 CSS via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
    LIVE CODE — PASSO 1: NAVBAR
    Troque este <header> por um componente <nav class="navbar ...">
    Estrutura:
      <nav class="navbar navbar-expand-lg bg-danger navbar-dark">
        <div class="container">
          <a class="navbar-brand fw-bold" href="#">Sabor & Saber</a>
          <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="#cardapio">Cardápio</a></li>
              <li class="nav-item"><a class="nav-link" href="#contato">Contato</a></li>
            </ul>
          </div>
        </div>
      </nav>
  -->
    <nav class="navbar navbar-expand-lg bg-danger navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="#">🍽️Sabor &amp; Saber</a>
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
          aria-controls="menu"
          aria-expanded="false"
          aria-label="Menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#cardapio">Cardápio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contato">Contato</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <h2 class="text-center mb-4">Nosso Cardápio</h2>

      <!--
      O JS vai renderizar os cards aqui.
      LIVE CODE — PASSO 2 (no script.js):
      Trocar card.innerHTML para usar componente Bootstrap:
        card-body, card-title, card-text, card-footer, btn
    -->
      <section id="cardapio" class="row g-3"></section>

      <hr class="my-5" />

      <!--
      LIVE CODE — PASSO 3: FORMULÁRIO
      Adicionar formulário de contato com:
        form-control nos inputs, form-label nas labels
        mb-3 entre os campos, btn btn-danger w-100 no botão
    -->
      <section id="contato" class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <h2 class="text-center mb-4 fw-bold">Fale conosco</h2>
          <form>
            <div class="mb-3">
              <label class="form-label">Seu nome</label>
              <input
                type="text"
                class="form-control"
                placeholder="Nome completo"
              />
            </div>
            <div class="mb-3">
              <label class="form-label">E-mail</label>
              <input
                type="email"
                class="form-control"
                placeholder="voce@email.com"
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Mensagem</label>
              <textarea
                class="form-control"
                rows="4"
                placeholder="Sua mensagem..."
              ></textarea>
            </div>
            <button type="button" class="btn btn-danger w-100">
              Enviar mensagem
            </button>
          </form>
        </div>
      </section>
    </main>

    <!-- LIVE CODE — PASSO 4: MODAL
    Adicionar modal de detalhes do prato ANTES do </body>.
    O botão no card vai referenciar este modal via data-bs-target. -->

       <!-- Estrutura base do MODAL -->
    <div class="modal fade" id="modalPrato" tabindex="-1" aria-hidden="true">
      <!-- Definição modal HORIZONTAL / VERTICAL -->
      <div class="modal-dialog modal-dialog-centered">
        <!-- Conteúdo Modal -->
        <div class="modal-content">
          <!-- Cabeçalho Modal -->
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="modalNome"></h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <!-- Corpo Modal -->
          <div class="modal-body">
            <p class="text-muted mb-1" id="modalCategoria"></p>
            <p class="fs-4 fw-bold text-success mb-3" id="modalPreco"></p>
            <p id="modalDescricao"></p>
          </div>
          <!-- Rodapé Modal -->
           <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary">Fechar</button>
            <button type="button" class="btn btn-danger">Pedir Agora</button>
           </div>
        </div>
      </div>
    </div>

    <!--
    LIVE CODE — PASSO 5: JS DO BOOTSTRAP
    Necessário para Navbar hambúrguer e Modal funcionarem.
    Adicionar antes do </body>:
  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js" defer></script>
  </body>
</html>>
